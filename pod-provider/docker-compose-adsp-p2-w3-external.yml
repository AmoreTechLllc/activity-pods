# ADSP Phase 2 W3 only. Compose this after docker-compose-adsp-p2-horizontal.yml.
# W1 remains native and unchanged; this overlay flips the same 1/2/4 pod cells to
# the already-proven ActivityPods -> sidecar external-delivery authority path.

x-adsp-p2-w3-external-environment: &adsp-p2-w3-external-environment
  SEMAPPS_ACTIVITYPUB_REMOTE_DELIVERY_MODE: external
  SEMAPPS_ACTIVITYPUB_ALLOW_EXTERNAL_DELIVERY_PREVIEW: 'true'
  SEMAPPS_ACTIVITYPUB_EXTERNAL_AUTHORITY_CUTOVER: 'false'
  SIDECAR_DELIVERY_HANDOFF_URL: '${ADSP_P2_W3_SIDECAR_HANDOFF_URL:-http://host.docker.internal:8080/webhook/outbox}'
  ACTIVITYPODS_TOKEN: '${ACTIVITYPODS_TOKEN:-}'
  SIDECAR_TOKEN: '${SIDECAR_TOKEN:-}'
  SEMAPPS_MOLECULER_LOCALITY_TELEMETRY_ENABLED: 'true'
  ADSP_P2_W3_BRIDGE_UPSTREAM_HOST: 'host.docker.internal'
  ADSP_P2_W3_BRIDGE_UPSTREAM_PORT: '${ADSP_P2_W3_BRIDGE_UPSTREAM_PORT:-18080}'

x-adsp-p2-w3-external-hosts: &adsp-p2-w3-external-hosts
  - 'host.docker.internal:host-gateway'

# The production image normally executes `pm2-runtime ecosystem.config.js`.
# W3 alone starts the benchmark-only loopback discovery bridge first and then
# execs the unchanged PM2 runtime as PID 1. Container teardown therefore still
# owns both processes, while production/W1 command semantics remain untouched.
x-adsp-p2-w3-command: &adsp-p2-w3-command
  - /bin/sh
  - -ec
  - 'node scripts/adsp-p2-w3-loopback-bridge.js & exec pm2-runtime ecosystem.config.js'

services:
  backend:
    command: *adsp-p2-w3-command
    extra_hosts: *adsp-p2-w3-external-hosts
    environment:
      <<: *adsp-p2-w3-external-environment
      SEMAPPS_MOLECULER_LOCALITY_TELEMETRY_OUTPUT: '/app/backend/measurements/adsp-p2-w3/locality-r1.json'

  backend_p2_2:
    command: *adsp-p2-w3-command
    extra_hosts: *adsp-p2-w3-external-hosts
    environment:
      <<: *adsp-p2-w3-external-environment
      SEMAPPS_MOLECULER_LOCALITY_TELEMETRY_OUTPUT: '/app/backend/measurements/adsp-p2-w3/locality-r2.json'

  backend_p2_3:
    command: *adsp-p2-w3-command
    extra_hosts: *adsp-p2-w3-external-hosts
    environment:
      <<: *adsp-p2-w3-external-environment
      SEMAPPS_MOLECULER_LOCALITY_TELEMETRY_OUTPUT: '/app/backend/measurements/adsp-p2-w3/locality-r3.json'

  backend_p2_4:
    command: *adsp-p2-w3-command
    extra_hosts: *adsp-p2-w3-external-hosts
    environment:
      <<: *adsp-p2-w3-external-environment
      SEMAPPS_MOLECULER_LOCALITY_TELEMETRY_OUTPUT: '/app/backend/measurements/adsp-p2-w3/locality-r4.json'
