services:
  backend:
    environment:
      # Phase 8 measures ActivityPub local fan-out. Disable only the unrelated
      # ATProto account projection; Tier 1 Pod/key/ActivityPub bootstrap still
      # runs and the signup hook below waits for the full local registry state.
      APODS_AUTO_PROVISION_ATPROTO_ON_SIGNUP: 'false'
      APODS_FORCE_COMPLETE_SIGNUP_BOOTSTRAP: 'true'

      # Provisioning 1,001 fully bootstrapped Pod actors is setup, not measured
      # load. Keep the same readiness conditions but allow more time than the
      # production defaults while the benchmark fixture is built. The forced
      # signup hook retries only timeout-shaped readiness failures and never
      # skips a missing registration or retries non-timeout errors.
      APODS_KEY_CONTAINER_WAIT_TIMEOUT_MS: '90000'
      APODS_FORCE_COMPLETE_SIGNUP_BOOTSTRAP_ATTEMPTS: '3'

      # Keep the benchmark local-only and suppress the transitional sidecar
      # observer so unrelated failed HTTP attempts cannot contaminate samples.
      SEMAPPS_ACTIVITYPUB_REMOTE_DELIVERY_MODE: native
      SIDECAR_WEBHOOK_URL: ''

      # These values are supplied by the measurement workflow before each
      # backend recreation. The recipient count is metadata only; the runner
      # independently validates that the Activity contains exactly N actors.
      SEMAPPS_APDM_PHASE8_INSTRUMENTATION_ENABLED: '${APDM_P8_ENABLED:-false}'
      SEMAPPS_APDM_PHASE8_RECIPIENT_COUNT: '${APDM_P8_COUNT:-0}'
      SEMAPPS_APDM_PHASE8_CASE_LABEL: 'real-local-${APDM_P8_COUNT:-0}'
      SEMAPPS_APDM_PHASE8_INSTRUMENTATION_OUTPUT: '/app/backend/measurements/apdm-p8-${APDM_P8_COUNT:-0}.jsonl'

      # Runner settings are passed into docker compose exec as well. Provision
      # conservatively so fixture creation does not stress the same Fuseki/Pod
      # resources Phase 8 is intended to measure later under isolated roots.
      APDM_P8_RUN_ID: '${APDM_P8_RUN_ID:-local}'
      APDM_P8_SAMPLES: '${APDM_P8_SAMPLES:-3}'
      APDM_P8_WARMUPS: '${APDM_P8_WARMUPS:-1}'
      APDM_P8_PROVISION_CONCURRENCY: '${APDM_P8_PROVISION_CONCURRENCY:-4}'

    volumes:
      - ./measurements:/app/backend/measurements
