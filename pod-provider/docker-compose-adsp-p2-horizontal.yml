x-adsp-p2-common: &adsp-p2-common
  image: apdm-phase8-backend:local
  depends_on:
    - fuseki_test
    - redis
    - mailcatcher
  restart: 'no'
  expose:
    - '3000'
  volumes:
    - ./measurements:/app/backend/measurements
  environment: &adsp-p2-environment
    NODE_ENV: test
    SEMAPPS_SPARQL_ENDPOINT: http://fuseki_test:3030/
    SEMAPPS_QUEUE_SERVICE_URL: redis://redis:6379/11
    SEMAPPS_REDIS_TRANSPORTER_URL: redis://redis:6379/12
    SEMAPPS_REDIS_OIDC_PROVIDER_URL: redis://redis:6379/13
    SEMAPPS_REDIS_CACHE_URL: redis://redis:6379/10
    REDIS_URL: redis://redis:6379
    SEMAPPS_SMTP_HOST: mailcatcher
    SEMAPPS_ACTIVITYPUB_REMOTE_DELIVERY_MODE: native
    SIDECAR_WEBHOOK_URL: ''
    SEMAPPS_MOLECULER_MODE: distributed
    SEMAPPS_MOLECULER_NAMESPACE: '${ADSP_P2_NAMESPACE:-adsp-p2-horizontal}'
    SEMAPPS_MOLECULER_SERVICE_GROUP: pod-cell
    APODS_AUTO_PROVISION_ATPROTO_ON_SIGNUP: 'false'
    APODS_FORCE_COMPLETE_SIGNUP_BOOTSTRAP: 'true'
    APODS_DEFER_COMPLETE_SIGNUP_BOOTSTRAP: 'true'
    APODS_KEY_CONTAINER_WAIT_TIMEOUT_MS: '90000'
    APODS_FORCE_COMPLETE_SIGNUP_BOOTSTRAP_ATTEMPTS: '3'
    APDM_P8_SIGNUP_TIMEOUT_MS: '900000'
    APODS_HTTP_SERVER_TIMEOUT_MS: '960000'
    APDM_LOCAL_DELIVERY_CONCURRENCY: '${APDM_P9_CONCURRENCY:-4}'
    APDM_LOCAL_DELIVERY_DATASET_EXIST_MEMO_ENABLED: 'false'
    SEMAPPS_MOLECULER_LOCALITY_TELEMETRY_ENABLED: '${ADSP_P2_LOCALITY_TELEMETRY_ENABLED:-false}'
    SEMAPPS_APDM_PHASE8_INSTRUMENTATION_ENABLED: '${APDM_P8_ENABLED:-false}'
    SEMAPPS_APDM_PHASE8_RECIPIENT_COUNT: '${APDM_P8_COUNT:-0}'
    SEMAPPS_APDM_PHASE8_CASE_LABEL: 'adsp-p2-${ADSP_P2_REPLICAS:-0}r-${APDM_P8_COUNT:-0}n'
    APDM_P8_RUN_ID: '${APDM_P8_RUN_ID:-adsp-p2}'
    APDM_P8_SAMPLES: '${APDM_P8_SAMPLES:-5}'
    APDM_P8_WARMUPS: '${APDM_P8_WARMUPS:-1}'
    APDM_P8_PROVISION_CONCURRENCY: '${APDM_P8_PROVISION_CONCURRENCY:-4}'
    APDM_P8_PROVISION_BATCH_SIZE: '${APDM_P8_PROVISION_BATCH_SIZE:-24}'
    APDM_P8_BOOTSTRAP_CONCURRENCY: '${APDM_P8_BOOTSTRAP_CONCURRENCY:-8}'

services:
  # Replica 1 deliberately reuses the canonical `backend` service so existing
  # provisioning tooling keeps one stable HTTP ingress. Comparative P2 measured
  # roots enter through a separate Redis-transported benchmark broker so all
  # eligible pod-cell replicas may receive the root while nested Tier-1 calls
  # remain local under registry.preferLocal.
  backend:
    environment:
      <<: *adsp-p2-environment
      SEMAPPS_MOLECULER_NODE_ID: adsp-p2-pod-cell-1
      SEMAPPS_APDM_PHASE8_INSTRUMENTATION_OUTPUT: '/app/backend/measurements/adsp-p2/trace-${APDM_P8_COUNT:-0}-r1.jsonl'

  backend_p2_2:
    <<: *adsp-p2-common
    ports:
      - '3102:3000'
    environment:
      <<: *adsp-p2-environment
      SEMAPPS_MOLECULER_NODE_ID: adsp-p2-pod-cell-2
      SEMAPPS_APDM_PHASE8_INSTRUMENTATION_OUTPUT: '/app/backend/measurements/adsp-p2/trace-${APDM_P8_COUNT:-0}-r2.jsonl'

  backend_p2_3:
    <<: *adsp-p2-common
    ports:
      - '3103:3000'
    environment:
      <<: *adsp-p2-environment
      SEMAPPS_MOLECULER_NODE_ID: adsp-p2-pod-cell-3
      SEMAPPS_APDM_PHASE8_INSTRUMENTATION_OUTPUT: '/app/backend/measurements/adsp-p2/trace-${APDM_P8_COUNT:-0}-r3.jsonl'

  backend_p2_4:
    <<: *adsp-p2-common
    ports:
      - '3104:3000'
    environment:
      <<: *adsp-p2-environment
      SEMAPPS_MOLECULER_NODE_ID: adsp-p2-pod-cell-4
      SEMAPPS_APDM_PHASE8_INSTRUMENTATION_OUTPUT: '/app/backend/measurements/adsp-p2/trace-${APDM_P8_COUNT:-0}-r4.jsonl'
