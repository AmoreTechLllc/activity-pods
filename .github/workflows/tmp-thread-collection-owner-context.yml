name: Temporary thread collection owner context

on:
  push:
    branches:
      - fix/activitypub-collection-dataset-context
    paths:
      - '.github/workflows/tmp-thread-collection-owner-context.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/activitypub-collection-dataset-context

      - name: Thread owner dataset through blocked and muted collection operations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def r(path, old, new, label, count=1):
              text = path.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{label}: expected {count} matches, found {actual}')
              path.write_text(text.replace(old, new))

          blocked = Path('pod-provider/backend/services/activitypub-blocked-collection.service.js')
          muted = Path('pod-provider/backend/services/activitypub-muted-collection.service.js')
          regression = Path('pod-provider/backend/tests/activitypub-collection-dataset-context.test.js')
          blocked_test = Path('pod-provider/backend/tests/activitypub-blocked-collection.test.js')
          muted_test = Path('pod-provider/backend/tests/activitypub-muted-collection.test.js')

          # Blocked: bootstrap registry calls inherit the authoritative owner dataset.
          r(blocked,
            """      await ctx.call('activitypub.collections-registry.createAndAttachCollection', {
        objectUri: actorUri,
        collection: this.settings.blockedCollectionOptions
      });
      await ctx.call('activitypub.collections-registry.createAndAttachCollection', {
        objectUri: actorUri,
        collection: this.settings.blocksCollectionOptions
      });""",
            """      await ctx.call(
        'activitypub.collections-registry.createAndAttachCollection',
        {
          objectUri: actorUri,
          collection: this.settings.blockedCollectionOptions
        },
        { meta: { dataset } }
      );
      await ctx.call(
        'activitypub.collections-registry.createAndAttachCollection',
        {
          objectUri: actorUri,
          collection: this.settings.blocksCollectionOptions
        },
        { meta: { dataset } }
      );""",
            'blocked registry context')

          r(blocked,
            """        await this.ensureBlockedFollowersCollection(ctx, blockedCollectionUri, actorUri);
        await this.ensurePublicReadOnBlockedCollection(ctx, blockedCollectionUri, actorUri, true);""",
            """        await this.ensureBlockedFollowersCollection(ctx, blockedCollectionUri, actorUri, dataset);
        await this.ensurePublicReadOnBlockedCollection(ctx, blockedCollectionUri, actorUri, true, dataset);""",
            'blocked public bootstrap threading')

          r(blocked,
            """    async ensureBlockedFollowersCollection(ctx, blockedCollectionUri, actorUri) {
      const existingState = await this.getBlockedCollectionSharingStateByCollectionUri(ctx, blockedCollectionUri);""",
            """    async ensureBlockedFollowersCollection(ctx, blockedCollectionUri, actorUri, dataset) {
      const resolvedDataset = dataset || (await this.resolveActorDataset(ctx, actorUri));
      const existingState = await this.getBlockedCollectionSharingStateByCollectionUri(
        ctx,
        blockedCollectionUri,
        resolvedDataset
      );""",
            'blocked followers resolver')

          r(blocked,
            """      const exists = await ctx.call('activitypub.collection.exist', {
        resourceUri: followersCollectionUri,
        webId: 'system'
      });""",
            """      const exists = await ctx.call(
        'activitypub.collection.exist',
        {
          resourceUri: followersCollectionUri,
          webId: 'system'
        },
        { meta: { dataset: resolvedDataset } }
      );""",
            'blocked followers exist context')

          r(blocked,
            """          meta: {
              forcedResourceUri: followersCollectionUri
            }""",
            """          meta: {
              dataset: resolvedDataset,
              forcedResourceUri: followersCollectionUri
            }""",
            'blocked followers post context')

          r(blocked,
            """        {
          resourceUri: blockedCollectionUri,
          triplesToAdd: [
            quad(namedNode(blockedCollectionUri), namedNode(AS_FOLLOWERS_PREDICATE), namedNode(followersCollectionUri))
          ]
        },
        {
          meta: {
            skipObjectsWatcher: true
          }
        }
      );

      return followersCollectionUri;
    },
    async detachBlockedFollowersCollection(ctx, blockedCollectionUri) {""",
            """        {
          resourceUri: blockedCollectionUri,
          webId: actorUri,
          triplesToAdd: [
            quad(namedNode(blockedCollectionUri), namedNode(AS_FOLLOWERS_PREDICATE), namedNode(followersCollectionUri))
          ]
        },
        {
          meta: {
            dataset: resolvedDataset,
            skipObjectsWatcher: true
          }
        }
      );

      return followersCollectionUri;
    },
    async detachBlockedFollowersCollection(ctx, blockedCollectionUri, actorUri, dataset) {
      const resolvedDataset = dataset || (await this.resolveActorDataset(ctx, actorUri));""",
            'blocked followers patch/detach signature')

          r(blocked,
            """      const state = await this.getBlockedCollectionSharingStateByCollectionUri(ctx, blockedCollectionUri);""",
            """      const state = await this.getBlockedCollectionSharingStateByCollectionUri(
        ctx,
        blockedCollectionUri,
        resolvedDataset
      );""",
            'blocked detach sharing context')

          r(blocked,
            """          resourceUri: blockedCollectionUri,
          triplesToRemove:""",
            """          resourceUri: blockedCollectionUri,
          webId: actorUri,
          triplesToRemove:""",
            'blocked detach webid', count=1)

          # The first remaining no-dataset skipObjectsWatcher block after detach is the detach patch.
          marker = """        {
          meta: {
            skipObjectsWatcher: true
          }
        }
      );

      return state.followersCollectionUri;
    },
    async setBlockedCollectionPublicFlag(ctx, blockedCollectionUri, isPublic) {"""
          replacement = """        {
          meta: {
            dataset: resolvedDataset,
            skipObjectsWatcher: true
          }
        }
      );

      return state.followersCollectionUri;
    },
    async setBlockedCollectionPublicFlag(ctx, blockedCollectionUri, actorUri, isPublic, dataset) {
      const resolvedDataset = dataset || (await this.resolveActorDataset(ctx, actorUri));"""
          r(blocked, marker, replacement, 'blocked detach dataset/public flag signature')

          r(blocked,
            """      const patch = {
        resourceUri: blockedCollectionUri,""",
            """      const patch = {
        resourceUri: blockedCollectionUri,
        webId: actorUri,""",
            'blocked public flag webid')

          r(blocked,
            """      await ctx.call('ldp.resource.patch', patch, {
        meta: {
          skipObjectsWatcher: true
        }
      });
    },
    async ensurePublicReadOnBlockedCollection(ctx, blockedCollectionUri, actorUri, isPublic) {""",
            """      await ctx.call('ldp.resource.patch', patch, {
        meta: {
          dataset: resolvedDataset,
          skipObjectsWatcher: true
        }
      });
    },
    async ensurePublicReadOnBlockedCollection(ctx, blockedCollectionUri, actorUri, isPublic, dataset) {
      const resolvedDataset = dataset || (await this.resolveActorDataset(ctx, actorUri));""",
            'blocked flag dataset/public read signature')

          r(blocked,
            """        await ctx.call('webacl.resource.addRights', {
          resourceUri: blockedCollectionUri,
          additionalRights: {
            anon: {
              read: true
            }
          },
          webId: actorUri
        });""",
            """        await ctx.call(
          'webacl.resource.addRights',
          {
            resourceUri: blockedCollectionUri,
            additionalRights: {
              anon: {
                read: true
              }
            },
            webId: actorUri
          },
          { meta: { dataset: resolvedDataset } }
        );""",
            'blocked acl add dataset')

          r(blocked,
            """      await ctx.call('webacl.resource.removeRights', {
        resourceUri: blockedCollectionUri,
        rights: {
          anon: {
            read: true
          }
        },
        webId: actorUri
      });""",
            """      await ctx.call(
        'webacl.resource.removeRights',
        {
          resourceUri: blockedCollectionUri,
          rights: {
            anon: {
              read: true
            }
          },
          webId: actorUri
        },
        { meta: { dataset: resolvedDataset } }
      );""",
            'blocked acl remove dataset')

          r(blocked,
            """    async setBlockedCollectionPublicState(ctx, actorUri, isPublic) {
      await this.ensureCollectionsForActor(ctx, actorUri);

      const blockedCollectionUri = (await this.resolveBlockedCollectionUri(ctx, actorUri)) || `${actorUri}/blocked`;
      if (isPublic) {
        await this.ensureBlockedFollowersCollection(ctx, blockedCollectionUri, actorUri);
      } else {
        await this.detachBlockedFollowersCollection(ctx, blockedCollectionUri);
      }

      await this.setBlockedCollectionPublicFlag(ctx, blockedCollectionUri, isPublic);
      await this.ensurePublicReadOnBlockedCollection(ctx, blockedCollectionUri, actorUri, isPublic);

      return this.getBlockedCollectionSharingStateByCollectionUri(ctx, blockedCollectionUri);
    },""",
            """    async setBlockedCollectionPublicState(ctx, actorUri, isPublic) {
      const dataset = await this.resolveActorDataset(ctx, actorUri);
      await this.ensureCollectionsForActor(ctx, actorUri, dataset);

      const blockedCollectionUri = (await this.resolveBlockedCollectionUri(ctx, actorUri)) || `${actorUri}/blocked`;
      if (isPublic) {
        await this.ensureBlockedFollowersCollection(ctx, blockedCollectionUri, actorUri, dataset);
      } else {
        await this.detachBlockedFollowersCollection(ctx, blockedCollectionUri, actorUri, dataset);
      }

      await this.setBlockedCollectionPublicFlag(ctx, blockedCollectionUri, actorUri, isPublic, dataset);
      await this.ensurePublicReadOnBlockedCollection(ctx, blockedCollectionUri, actorUri, isPublic, dataset);

      return this.getBlockedCollectionSharingStateByCollectionUri(ctx, blockedCollectionUri, dataset);
    },""",
            'blocked public state threading')

          r(blocked,
            """    async ensureCollectionsForActor(ctx, actorUri) {
      const dataset = await this.resolveActorDataset(ctx, actorUri);""",
            """    async ensureCollectionsForActor(ctx, actorUri, dataset) {
      dataset = dataset || (await this.resolveActorDataset(ctx, actorUri));""",
            'blocked bootstrap optional dataset')

          # Muted mirrors blocked.
          r(muted,
            """      await ctx.call('activitypub.collections-registry.createAndAttachCollection', {
        objectUri: actorUri,
        collection: this.settings.mutedCollectionOptions
      });""",
            """      await ctx.call(
        'activitypub.collections-registry.createAndAttachCollection',
        {
          objectUri: actorUri,
          collection: this.settings.mutedCollectionOptions
        },
        { meta: { dataset } }
      );""",
            'muted registry context')

          r(muted,
            """        await this.ensureMutedFollowersCollection(ctx, mutedCollectionUri, actorUri);
        await this.ensurePublicReadOnMutedCollection(ctx, mutedCollectionUri, actorUri, true);""",
            """        await this.ensureMutedFollowersCollection(ctx, mutedCollectionUri, actorUri, dataset);
        await this.ensurePublicReadOnMutedCollection(ctx, mutedCollectionUri, actorUri, true, dataset);""",
            'muted public bootstrap threading')

          r(muted,
            """    async ensureMutedFollowersCollection(ctx, mutedCollectionUri, actorUri) {
      const existingState = await this.getMutedCollectionSharingStateByCollectionUri(ctx, mutedCollectionUri);""",
            """    async ensureMutedFollowersCollection(ctx, mutedCollectionUri, actorUri, dataset) {
      const resolvedDataset = dataset || (await this.resolveActorDataset(ctx, actorUri));
      const existingState = await this.getMutedCollectionSharingStateByCollectionUri(
        ctx,
        mutedCollectionUri,
        resolvedDataset
      );""",
            'muted followers resolver')

          r(muted,
            """      const exists = await ctx.call('activitypub.collection.exist', {
        resourceUri: followersCollectionUri,
        webId: 'system'
      });""",
            """      const exists = await ctx.call(
        'activitypub.collection.exist',
        {
          resourceUri: followersCollectionUri,
          webId: 'system'
        },
        { meta: { dataset: resolvedDataset } }
      );""",
            'muted followers exist context')

          r(muted,
            """          meta: {
              forcedResourceUri: followersCollectionUri
            }""",
            """          meta: {
              dataset: resolvedDataset,
              forcedResourceUri: followersCollectionUri
            }""",
            'muted followers post context')

          r(muted,
            """        {
          resourceUri: mutedCollectionUri,
          triplesToAdd: [
            quad(namedNode(mutedCollectionUri), namedNode(AS_FOLLOWERS_PREDICATE), namedNode(followersCollectionUri))
          ]
        },
        {
          meta: {
            skipObjectsWatcher: true
          }
        }
      );

      return followersCollectionUri;
    },
    async detachMutedFollowersCollection(ctx, mutedCollectionUri) {""",
            """        {
          resourceUri: mutedCollectionUri,
          webId: actorUri,
          triplesToAdd: [
            quad(namedNode(mutedCollectionUri), namedNode(AS_FOLLOWERS_PREDICATE), namedNode(followersCollectionUri))
          ]
        },
        {
          meta: {
            dataset: resolvedDataset,
            skipObjectsWatcher: true
          }
        }
      );

      return followersCollectionUri;
    },
    async detachMutedFollowersCollection(ctx, mutedCollectionUri, actorUri, dataset) {
      const resolvedDataset = dataset || (await this.resolveActorDataset(ctx, actorUri));""",
            'muted followers patch/detach signature')

          r(muted,
            """      const state = await this.getMutedCollectionSharingStateByCollectionUri(ctx, mutedCollectionUri);""",
            """      const state = await this.getMutedCollectionSharingStateByCollectionUri(
        ctx,
        mutedCollectionUri,
        resolvedDataset
      );""",
            'muted detach sharing context')

          r(muted,
            """          resourceUri: mutedCollectionUri,
          triplesToRemove:""",
            """          resourceUri: mutedCollectionUri,
          webId: actorUri,
          triplesToRemove:""",
            'muted detach webid', count=1)

          marker = """        {
          meta: {
            skipObjectsWatcher: true
          }
        }
      );

      return state.followersCollectionUri;
    },
    async setMutedCollectionPublicFlag(ctx, mutedCollectionUri, isPublic) {"""
          replacement = """        {
          meta: {
            dataset: resolvedDataset,
            skipObjectsWatcher: true
          }
        }
      );

      return state.followersCollectionUri;
    },
    async setMutedCollectionPublicFlag(ctx, mutedCollectionUri, actorUri, isPublic, dataset) {
      const resolvedDataset = dataset || (await this.resolveActorDataset(ctx, actorUri));"""
          r(muted, marker, replacement, 'muted detach dataset/public flag signature')

          r(muted,
            """      const patch = {
        resourceUri: mutedCollectionUri,""",
            """      const patch = {
        resourceUri: mutedCollectionUri,
        webId: actorUri,""",
            'muted public flag webid')

          r(muted,
            """      await ctx.call('ldp.resource.patch', patch, {
        meta: {
          skipObjectsWatcher: true
        }
      });
    },
    async ensurePublicReadOnMutedCollection(ctx, mutedCollectionUri, actorUri, isPublic) {""",
            """      await ctx.call('ldp.resource.patch', patch, {
        meta: {
          dataset: resolvedDataset,
          skipObjectsWatcher: true
        }
      });
    },
    async ensurePublicReadOnMutedCollection(ctx, mutedCollectionUri, actorUri, isPublic, dataset) {
      const resolvedDataset = dataset || (await this.resolveActorDataset(ctx, actorUri));""",
            'muted flag dataset/public read signature')

          r(muted,
            """        await ctx.call('webacl.resource.addRights', {
          resourceUri: collectionUri,
          additionalRights: {
            anon: {
              read: true
            }
          },
          webId: actorUri
        });""",
            """        await ctx.call(
          'webacl.resource.addRights',
          {
            resourceUri: collectionUri,
            additionalRights: {
              anon: {
                read: true
              }
            },
            webId: actorUri
          },
          { meta: { dataset: resolvedDataset } }
        );""",
            'muted acl add dataset')

          r(muted,
            """      await ctx.call('webacl.resource.removeRights', {
        resourceUri: collectionUri,
        rights: {
          anon: {
            read: true
          }
        },
        webId: actorUri
      });""",
            """      await ctx.call(
        'webacl.resource.removeRights',
        {
          resourceUri: collectionUri,
          rights: {
            anon: {
              read: true
            }
          },
          webId: actorUri
        },
        { meta: { dataset: resolvedDataset } }
      );""",
            'muted acl remove dataset')

          r(muted,
            """    async setMutedCollectionPublicState(ctx, actorUri, isPublic) {
      await this.ensureCollectionsForActor(ctx, actorUri);

      const mutedCollectionUri = (await this.resolveMutedCollectionUri(ctx, actorUri)) || `${actorUri}/muted`;
      if (isPublic) {
        await this.ensureMutedFollowersCollection(ctx, mutedCollectionUri, actorUri);
      } else {
        await this.detachMutedFollowersCollection(ctx, mutedCollectionUri);
      }

      await this.setMutedCollectionPublicFlag(ctx, mutedCollectionUri, isPublic);
      await this.ensurePublicReadOnMutedCollection(ctx, mutedCollectionUri, actorUri, isPublic);

      return this.getMutedCollectionSharingStateByCollectionUri(ctx, mutedCollectionUri);
    }""",
            """    async setMutedCollectionPublicState(ctx, actorUri, isPublic) {
      const dataset = await this.resolveActorDataset(ctx, actorUri);
      await this.ensureCollectionsForActor(ctx, actorUri, dataset);

      const mutedCollectionUri = (await this.resolveMutedCollectionUri(ctx, actorUri)) || `${actorUri}/muted`;
      if (isPublic) {
        await this.ensureMutedFollowersCollection(ctx, mutedCollectionUri, actorUri, dataset);
      } else {
        await this.detachMutedFollowersCollection(ctx, mutedCollectionUri, actorUri, dataset);
      }

      await this.setMutedCollectionPublicFlag(ctx, mutedCollectionUri, actorUri, isPublic, dataset);
      await this.ensurePublicReadOnMutedCollection(ctx, mutedCollectionUri, actorUri, isPublic, dataset);

      return this.getMutedCollectionSharingStateByCollectionUri(ctx, mutedCollectionUri, dataset);
    }""",
            'muted public state threading')

          r(muted,
            """    async ensureCollectionsForActor(ctx, actorUri) {
      const dataset = await this.resolveActorDataset(ctx, actorUri);""",
            """    async ensureCollectionsForActor(ctx, actorUri, dataset) {
      dataset = dataset || (await this.resolveActorDataset(ctx, actorUri));""",
            'muted bootstrap optional dataset')

          # Harden regression: verify bootstrap registry + follower chain dataset propagation.
          insert_before = "\n  test.each([\n    [\n      'blocked',\n      blockedService,\n      'getBlockedCollectionSharingStateByCollectionUri'"
          extra = r'''
  test.each([
    ['blocked', blockedService, 'ensureBlockedFollowersCollection', `${ACTOR_URI}/blocked`],
    ['muted', mutedService, 'ensureMutedFollowersCollection', `${ACTOR_URI}/muted`]
  ])('%s follower bootstrap carries owner dataset through nested operations', async (_name, service, methodName, collectionUri) => {
    const { ctx, calls } = makeContext({
      async call(action, params, options) {
        calls.push({ action, params, options });
        if (action === 'auth.account.findByWebId') return { webId: ACTOR_URI, username: DATASET };
        if (action === 'triplestore.query') return [];
        if (action === 'activitypub.collection.exist') return false;
        return undefined;
      }
    });
    const methods = bindMethods(service);

    await methods[methodName](ctx, collectionUri, ACTOR_URI, DATASET);

    expect(calls).toContainEqual(expect.objectContaining({
      action: 'activitypub.collection.exist',
      options: { meta: { dataset: DATASET } }
    }));
    expect(calls).toContainEqual(expect.objectContaining({
      action: 'activitypub.collection.post',
      params: expect.objectContaining({ webId: ACTOR_URI }),
      options: { meta: expect.objectContaining({ dataset: DATASET }) }
    }));
    expect(calls).toContainEqual(expect.objectContaining({
      action: 'ldp.resource.patch',
      params: expect.objectContaining({ webId: ACTOR_URI }),
      options: { meta: expect.objectContaining({ dataset: DATASET, skipObjectsWatcher: true }) }
    }));
  });

  test.each([
    ['blocked', blockedService, 2],
    ['muted', mutedService, 1]
  ])('%s collection bootstrap scopes registry calls to the owner dataset', async (_name, service, expectedRegistryCalls) => {
    const calls = [];
    const ctx = {
      async call(action, params, options) {
        calls.push({ action, params, options });
        if (action === 'activitypub.actor.get') {
          return {
            blocked: `${ACTOR_URI}/blocked`,
            blocks: `${ACTOR_URI}/blocks`,
            muted: `${ACTOR_URI}/muted`
          };
        }
        if (action === 'triplestore.query') return [];
        return undefined;
      }
    };
    const methods = bindMethods(service);

    await methods.ensureCollectionsForActor(ctx, ACTOR_URI, DATASET);

    const registryCalls = calls.filter(call => actionIs(call, 'activitypub.collections-registry.createAndAttachCollection'));
    expect(registryCalls).toHaveLength(expectedRegistryCalls);
    for (const call of registryCalls) {
      expect(call.options).toEqual({ meta: { dataset: DATASET } });
    }
  });
'''
          # Helper for readable filter expression.
          text = regression.read_text()
          if 'function actionIs(' not in text:
              text = text.replace("function bindMethods(serviceDefinition) {", "function actionIs(call, action) {\n  return call.action === action;\n}\n\nfunction bindMethods(serviceDefinition) {")
          if insert_before not in text:
              raise SystemExit('regression insertion anchor not found')
          text = text.replace(insert_before, extra + insert_before)
          regression.write_text(text)

          # Existing startup expectations now include the dataset-bearing parent context.
          for path, collection_exprs in [
              (blocked_test, ['service.settings.blockedCollectionOptions', 'service.settings.blocksCollectionOptions']),
              (muted_test, ['service.settings.mutedCollectionOptions'])
          ]:
              text = path.read_text()
              for expr in collection_exprs:
                  old = f"""    expect(broker.call).toHaveBeenCalledWith('activitypub.collections-registry.createAndAttachCollection', {{
      objectUri: 'https://fed.example.com/users/alice',
      collection: {expr}
    }});"""
                  new = f"""    expect(broker.call).toHaveBeenCalledWith(
      'activitypub.collections-registry.createAndAttachCollection',
      {{
        objectUri: 'https://fed.example.com/users/alice',
        collection: {expr}
      }},
      {{ meta: {{ dataset: 'alice' }} }}
    );"""
                  if old not in text:
                      raise SystemExit(f'startup expectation anchor missing in {path}: {expr}')
                  text = text.replace(old, new)
              path.write_text(text)

          # Existing public-state unit expectations thread the one resolved dataset.
          for path, prefix in [(blocked_test, 'Blocked'), (muted_test, 'Muted')]:
              text = path.read_text()
              # Mock the authoritative dataset resolver in the existing service fixture.
              anchor = """    const service = createService({
      ensureCollectionsForActor: jest.fn(),"""
              repl = """    const service = createService({
      resolveActorDataset: jest.fn(async () => 'alice'),
      ensureCollectionsForActor: jest.fn(),"""
              if anchor not in text:
                  raise SystemExit(f'public-state fixture anchor missing in {path}')
              text = text.replace(anchor, repl, 1)
              name = prefix.lower()
              collection = f"https://fed.example.com/users/alice/{name}"
              if prefix == 'Blocked': collection = 'https://fed.example.com/users/alice/blocked'
              if prefix == 'Muted': collection = 'https://fed.example.com/users/alice/muted'
              text = text.replace(
                  f"expect(service.ensureCollectionsForActor).toHaveBeenCalledWith(ctx, 'https://fed.example.com/users/alice');",
                  f"expect(service.ensureCollectionsForActor).toHaveBeenCalledWith(ctx, 'https://fed.example.com/users/alice', 'alice');",
                  1)
              text = text.replace(
                  f"      '{collection}',\n      'https://fed.example.com/users/alice'\n    );",
                  f"      '{collection}',\n      'https://fed.example.com/users/alice',\n      'alice'\n    );",
                  1)
              text = text.replace(
                  f"      '{collection}',\n      true\n    );",
                  f"      '{collection}',\n      'https://fed.example.com/users/alice',\n      true,\n      'alice'\n    );",
                  1)
              text = text.replace(
                  f"      '{collection}',\n      'https://fed.example.com/users/alice',\n      true\n    );",
                  f"      '{collection}',\n      'https://fed.example.com/users/alice',\n      true,\n      'alice'\n    );",
                  1)
              path.write_text(text)
          PY

      - name: Verify focused and existing collection suites
        working-directory: pod-provider/backend
        run: |
          npm exec --yes --package=jest@29.7.0 --package=esbuild@0.25.4 --package=esbuild-jest@0.5.0 -- \
            jest --testEnvironment=node \
              tests/activitypub-collection-dataset-context.test.js \
              tests/activitypub-blocked-collection.test.js \
              tests/activitypub-muted-collection.test.js \
              --runInBand

      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            pod-provider/backend/services/activitypub-blocked-collection.service.js \
            pod-provider/backend/services/activitypub-muted-collection.service.js \
            pod-provider/backend/tests/activitypub-collection-dataset-context.test.js \
            pod-provider/backend/tests/activitypub-blocked-collection.test.js \
            pod-provider/backend/tests/activitypub-muted-collection.test.js
          git diff --cached --check
          git commit -m 'fix: thread owner context through collection bootstrap'
          git push origin HEAD:fix/activitypub-collection-dataset-context
