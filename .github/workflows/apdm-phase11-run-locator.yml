name: APDM Phase 11 run locator

on:
  push:
    branches:
      - agent/apdm-phase11-query-attribution
    paths:
      - 'pod-provider/backend/docs/apdm-phase11-query-attribution.md'
      - 'pod-provider/docker/backend.dockerfile'

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Publish exact Phase 11 run ID to PR 78
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=''
          run_status=''
          for _ in $(seq 1 120); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/apdm-phase11-query-attribution.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=20")"
            run_id="$(jq -r '.workflow_runs | sort_by(.created_at) | reverse | .[0].id // empty' <<<"${runs}")"
            run_status="$(jq -r '.workflow_runs | sort_by(.created_at) | reverse | .[0].status // empty' <<<"${runs}")"
            [[ "${run_id}" =~ ^[0-9]+$ ]] && break
            sleep 5
          done
          [[ "${run_id}" =~ ^[0-9]+$ ]] || { echo "Unable to discover Phase 11 run for ${GITHUB_SHA}" >&2; exit 1; }
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/78/comments" \
            -f body="APDM Phase 11 durable locator: push-triggered run \`${run_id}\` at exact source \`${GITHUB_SHA}\` (status: ${run_status}). This run is authoritative only if all Phase 11 gates pass; the locator changes no measurement or delivery behavior." >/dev/null
          echo "Located Phase 11 run ${run_id} for ${GITHUB_SHA}."
