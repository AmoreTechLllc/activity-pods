name: ADSP P2 W1 Decision Evidence Dispatch

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/adsp-p2-w1-evidence-dispatch.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch merged W1 five-sample evidence workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/adsp-p2-horizontal-redis-comparator.yml/dispatches" \
            --data '{"ref":"master","inputs":{"recipient_counts":"10,100","samples":"5","requests_per_window":"8","concurrency":"8"}}')"
          test -z "$response"
