name: ADSP P2 W1 Decision Evidence Dispatch

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/adsp-p2-w1-evidence-dispatch.yml'

permissions:
  actions: read
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Discover newest merged W1 workflow-dispatch run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          json="$(curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/adsp-p2-horizontal-redis-comparator.yml/runs?event=workflow_dispatch&branch=master&per_page=5")"
          node - "$json" <<'NODE'
          const payload = JSON.parse(process.argv[2]);
          const run = payload.workflow_runs?.[0];
          if (!run) throw new Error('No master workflow_dispatch W1 comparator run found');
          if (run.event !== 'workflow_dispatch' || run.head_branch !== 'master') throw new Error('Latest run provenance mismatch');
          console.log(`W1_EVIDENCE_RUN_ID=${run.id}`);
          console.log(`W1_EVIDENCE_HEAD_SHA=${run.head_sha}`);
          console.log(`W1_EVIDENCE_STATUS=${run.status}`);
          console.log(`W1_EVIDENCE_CONCLUSION=${run.conclusion || ''}`);
          NODE
