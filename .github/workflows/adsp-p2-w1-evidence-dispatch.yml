name: ADSP P2 W1 Decision Evidence Dispatch

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/adsp-p2-w1-evidence-dispatch.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      EXPECTED_MASTER_SHA: '54ca8024d3c6f374988cca5b32eb6281f57c1aa2'
      W1_WORKFLOW: 'adsp-p2-horizontal-redis-comparator.yml'
    steps:
      - name: Verify repaired master and dispatch locked W1 evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          master_json="$(curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/commits/master")"
          actual_master_sha="$(node -e 'const p=JSON.parse(process.argv[1]); process.stdout.write(p.sha)' "$master_json")"
          if [[ "$actual_master_sha" != "$EXPECTED_MASTER_SHA" ]]; then
            echo "Refusing W1 evidence dispatch: master moved from reviewed SHA ${EXPECTED_MASTER_SHA} to ${actual_master_sha}" >&2
            exit 1
          fi

          dispatched_after="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/${W1_WORKFLOW}/dispatches" \
            --data '{"ref":"master","inputs":{"recipient_counts":"10,100","samples":"5","requests_per_window":"8","concurrency":"8"}}'

          found=false
          for attempt in $(seq 1 30); do
            runs_json="$(curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/actions/workflows/${W1_WORKFLOW}/runs?event=workflow_dispatch&branch=master&per_page=10")"
            match="$(node - "$runs_json" "$EXPECTED_MASTER_SHA" "$dispatched_after" <<'NODE'
          const [payloadRaw, expectedSha, dispatchedAfter] = process.argv.slice(2);
          const payload = JSON.parse(payloadRaw);
          const floor = Date.parse(dispatchedAfter);
          const run = (payload.workflow_runs || []).find(candidate =>
            candidate.event === 'workflow_dispatch' &&
            candidate.head_branch === 'master' &&
            candidate.head_sha === expectedSha &&
            Date.parse(candidate.created_at) >= floor
          );
          if (run) process.stdout.write(JSON.stringify({ id: run.id, head_sha: run.head_sha, status: run.status, conclusion: run.conclusion || '' }));
          NODE
          )"
            if [[ -n "$match" ]]; then
              echo "$match"
              node - "$match" <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const run = JSON.parse(process.argv[2]);
          process.stdout.write([
            '## ADSP P2 W1 canonical evidence dispatched',
            '',
            `- run: ${run.id}`,
            `- head SHA: \`${run.head_sha}\``,
            '- recipient counts: `10,100`',
            '- measured samples/case: `5`',
            '- outcomes/window: `8`',
            '- concurrency: `8`',
            `- initial status: ${run.status}`,
            ''
          ].join('\n'));
          NODE
              found=true
              break
            fi
            sleep 2
          done

          if [[ "$found" != true ]]; then
            echo "Dispatch returned successfully but no exact-SHA W1 run became discoverable" >&2
            exit 1
          fi
