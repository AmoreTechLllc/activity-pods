name: Temporary add registry owner WebID

on:
  push:
    branches:
      - fix/activitypub-collection-dataset-context
    paths:
      - '.github/scripts/tmp-add-registry-owner-webid.py'
      - '.github/workflows/tmp-add-registry-owner-webid.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/activitypub-collection-dataset-context
      - name: Apply fix
        run: python .github/scripts/tmp-add-registry-owner-webid.py
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pod-provider/backend/services/activitypub-blocked-collection.service.js \
                  pod-provider/backend/services/activitypub-muted-collection.service.js \
                  pod-provider/backend/tests/activitypub-collection-dataset-context.test.js \
                  pod-provider/backend/tests/activitypub-blocked-collection.test.js \
                  pod-provider/backend/tests/activitypub-muted-collection.test.js
          git diff --cached --check
          git commit -m 'fix: carry owner WebID into collection registry bootstrap'
          git push origin HEAD:fix/activitypub-collection-dataset-context
