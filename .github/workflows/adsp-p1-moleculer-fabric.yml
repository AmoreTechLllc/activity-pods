name: ADSP P1 Moleculer Fabric

on:
  pull_request:
    paths:
      - 'pod-provider/backend/config/moleculer-fabric.js'
      - 'pod-provider/backend/moleculer.config.js'
      - 'pod-provider/backend/RdfJSONSerializer.js'
      - 'pod-provider/backend/middlewares/adsp-action-locality.js'
      - 'pod-provider/backend/scripts/run-moleculer-fabric.js'
      - 'pod-provider/backend/scripts/proof-adsp-p1-moleculer-fabric.js'
      - 'pod-provider/backend/scripts/proof-adsp-p1-service-group-launcher.js'
      - 'pod-provider/backend/scripts/proof-adsp-p1-node-loss-authority.js'
      - 'pod-provider/backend/scripts/adsp-p1-authority-probe-worker.js'
      - 'pod-provider/backend/p1-fixtures/**'
      - 'pod-provider/backend/tests/moleculer-fabric.test.js'
      - 'pod-provider/backend/package.json'
      - '.github/workflows/adsp-p1-moleculer-fabric.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fabric-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: yarn
          cache-dependency-path: pod-provider/backend/yarn.lock

      - name: Enforce HTTPS for public Git dependencies
        working-directory: pod-provider/backend
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Normalize legacy SSH Git URLs in backend lockfile
        working-directory: pod-provider/backend
        run: |
          if [ -f yarn.lock ]; then
            sed -i 's#ssh://git@github.com/#https://github.com/#g' yarn.lock
            sed -i 's#git+ssh://git@github.com/#git+https://github.com/#g' yarn.lock
            sed -i 's#git@github.com:#https://github.com/#g' yarn.lock
          fi

      - name: Install backend dependencies
        working-directory: pod-provider/backend
        run: yarn install

      - name: Run fabric configuration tests
        run: |
          npm exec --yes \
            --package=jest@29.7.0 \
            --package=esbuild@0.25.4 \
            --package=esbuild-jest@0.5.0 \
            -- \
            jest --testEnvironment=node --runInBand pod-provider/backend/tests/moleculer-fabric.test.js

      - name: Run genuine remote-call fabric proof
        working-directory: pod-provider/backend
        env:
          SEMAPPS_REDIS_TRANSPORTER_URL: redis://127.0.0.1:6379
        run: node scripts/proof-adsp-p1-moleculer-fabric.js

      - name: Prove launcher starts only selected service group
        working-directory: pod-provider/backend
        env:
          SEMAPPS_REDIS_TRANSPORTER_URL: redis://127.0.0.1:6379
        run: node scripts/proof-adsp-p1-service-group-launcher.js

      - name: Prove node loss does not replay authoritative work
        working-directory: pod-provider/backend
        env:
          SEMAPPS_REDIS_TRANSPORTER_URL: redis://127.0.0.1:6379
        run: node scripts/proof-adsp-p1-node-loss-authority.js
