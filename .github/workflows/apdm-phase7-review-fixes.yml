name: APDM Phase 7 review fixes

on:
  push:
    branches:
      - apdm/phase-7-remove-duplicate-local-account-lookup
    paths:
      - '.github/workflows/apdm-phase7-review-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apdm/phase-7-remove-duplicate-local-account-lookup
      - name: Apply exact review fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'pod-provider/docker/backend.dockerfile',
              'ADD backend/yarn.lock /app/backend\nRUN yarn install && yarn cache clean',
              'ADD backend/yarn.lock /app/backend\n# postinstall patches the pinned SemApps ActivityPub artifact; copy the guarded patcher before install.\nADD backend/scripts/patch-semapps-activitypub-local-delivery.js /app/backend/scripts/patch-semapps-activitypub-local-delivery.js\nRUN yarn install && yarn cache clean'
          )

          replace_once(
              'pod-provider/backend/lib/activitypub-service-with-delivery-strategy.js',
              "  'this.localPost(localRecipients, activity)'",
              "  'this.localPost(localRecipients, activity, localRecipientContexts)'"
          )

          replace_once(
              'pod-provider/backend/lib/activitypub-service-with-delivery-strategy.js',
              "      executionContext.localPost = (recipients, localActivity) => {\n        capturedLocalPosts.push({\n          recipients: Array.isArray(recipients) ? [...recipients] : recipients,\n          activity: localActivity\n        });\n        return nativeLocalPost(recipients, localActivity);\n      };",
              "      executionContext.localPost = (recipients, localActivity, localRecipientContexts) => {\n        capturedLocalPosts.push({\n          recipients: Array.isArray(recipients) ? [...recipients] : recipients,\n          activity: localActivity\n        });\n        return nativeLocalPost(recipients, localActivity, localRecipientContexts);\n      };"
          )

          replace_once(
              'pod-provider/backend/tests/activitypub-remote-delivery-strategy.test.js',
              "    const nativeLocalPost = jest.fn(async () => undefined);\n    const nativeHandler = async function nativePost() {",
              "    const nativeLocalPost = jest.fn(async () => undefined);\n    const localRecipientContexts = new Map([\n      ['https://pods.example/bob', { dataset: 'bob' }],\n      ['https://pods.example/dan', { dataset: 'dan' }]\n    ]);\n    const nativeHandler = async function nativePost() {"
          )

          replace_once(
              'pod-provider/backend/tests/activitypub-remote-delivery-strategy.test.js',
              "      this.localPost(['https://pods.example/bob', 'https://pods.example/dan'], activity);",
              "      this.localPost(['https://pods.example/bob', 'https://pods.example/dan'], activity, localRecipientContexts);"
          )

          replace_once(
              'pod-provider/backend/tests/activitypub-remote-delivery-strategy.test.js',
              "    expect(nativeLocalPost).toHaveBeenCalledTimes(1);\n    expect(buildDeliveryPlan).toHaveBeenCalledWith(",
              "    expect(nativeLocalPost).toHaveBeenCalledTimes(1);\n    expect(nativeLocalPost).toHaveBeenCalledWith(\n      ['https://pods.example/bob', 'https://pods.example/dan'],\n      activity,\n      localRecipientContexts\n    );\n    expect(buildDeliveryPlan).toHaveBeenCalledWith("
          )

          test_path = Path('pod-provider/backend/tests/semapps-local-delivery-context-reuse.test.js')
          text = test_path.read_text()
          anchor = "  test('normal post-to-localPost path carries dataset context and preserves a legacy fallback', () => {"
          if text.count(anchor) != 1:
              raise SystemExit('Phase 7 test insertion anchor drifted')
          extra = """  test('production Docker image copies the lifecycle patcher before yarn install', () => {
    const dockerfile = fs.readFileSync(require('path').resolve(__dirname, '../../docker/backend.dockerfile'), 'utf8');
    const patcherCopy = dockerfile.indexOf('ADD backend/scripts/patch-semapps-activitypub-local-delivery.js');
    const install = dockerfile.indexOf('RUN yarn install && yarn cache clean');

    expect(patcherCopy).toBeGreaterThan(-1);
    expect(install).toBeGreaterThan(patcherCopy);
  });

  test('delivery-strategy startup guard accepts the installed Phase 7 outbox shape', () => {
    const { createActivityPubServiceWithDeliveryStrategy } = require('../lib/activitypub-service-with-delivery-strategy');
    expect(() => createActivityPubServiceWithDeliveryStrategy()).not.toThrow();
  });

"""
          test_path.write_text(text.replace(anchor, extra + anchor, 1))
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/apdm-phase7-review-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(apdm): address Phase 7 delivery context review'
          git push origin HEAD:apdm/phase-7-remove-duplicate-local-account-lookup
