name: APDM Phase 11 run reporter

on:
  workflow_run:
    workflows: ['APDM Phase 11 query attribution']
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/apdm-phase11-run-reporter.yml'
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  report-completion:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'agent/apdm-phase11-query-attribution'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish exact Phase 11 run identity to PR 78
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "${RUN_ID}" =~ ^[0-9]+$ ]] || exit 1
          [[ "${RUN_ATTEMPT}" =~ ^[0-9]+$ ]] || exit 1
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          marker="APDM Phase 11 run reporter: run \`${RUN_ID}\`, exact source \`${SOURCE_SHA}\`, attempt \`${RUN_ATTEMPT}\`, conclusion \`${RUN_CONCLUSION}\`."
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues/78/comments?per_page=100" --paginate --jq '.[].body')"
          if ! grep -Fq "${marker}" <<<"${existing}"; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/78/comments" \
              -f body="${marker} This report is discovery metadata only; evidence remains authoritative only after the Phase 11 gates are independently inspected." >/dev/null
          fi

  backfill-frozen-head:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'issue_comment' && github.event.issue.number == 78 && github.event.comment.body == '/apdm-phase11-backfill')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: 8da194836d41aa618b40e21c9e6ca28f6a5e00d7
      EXPECTED_BRANCH: agent/apdm-phase11-query-attribution
      WORKFLOW_FILE: apdm-phase11-query-attribution.yml
    steps:
      - name: Discover exact frozen-head Phase 11 run
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/78")"
          current_sha="$(jq -r '.head.sha' <<<"${pr}")"
          current_branch="$(jq -r '.head.ref' <<<"${pr}")"
          [[ "${current_sha}" == "${EXPECTED_SHA}" ]] || {
            echo "PR #78 head moved: ${current_sha} != ${EXPECTED_SHA}" >&2
            exit 1
          }
          [[ "${current_branch}" == "${EXPECTED_BRANCH}" ]] || {
            echo "PR #78 branch moved: ${current_branch} != ${EXPECTED_BRANCH}" >&2
            exit 1
          }

          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs?branch=${EXPECTED_BRANCH}&head_sha=${EXPECTED_SHA}&per_page=100")"
          run_id="$(jq -r '.workflow_runs | map(select(.head_sha == env.EXPECTED_SHA and .head_branch == env.EXPECTED_BRANCH)) | sort_by(.created_at) | reverse | .[0].id // empty' <<<"${runs}")"
          [[ "${run_id}" =~ ^[0-9]+$ ]] || {
            echo "No Phase 11 run found at exact frozen head ${EXPECTED_SHA}" >&2
            exit 1
          }

          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
          run_sha="$(jq -r '.head_sha' <<<"${run}")"
          run_branch="$(jq -r '.head_branch' <<<"${run}")"
          run_attempt="$(jq -r '.run_attempt' <<<"${run}")"
          run_status="$(jq -r '.status' <<<"${run}")"
          run_conclusion="$(jq -r '.conclusion // ""' <<<"${run}")"
          [[ "${run_sha}" == "${EXPECTED_SHA}" ]] || exit 1
          [[ "${run_branch}" == "${EXPECTED_BRANCH}" ]] || exit 1

          marker="APDM Phase 11 durable locator: run \`${run_id}\`, exact source \`${run_sha}\`, attempt \`${run_attempt}\`, status \`${run_status}\`, conclusion \`${run_conclusion:-pending}\`."
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues/78/comments?per_page=100" --paginate --jq '.[].body')"
          if ! grep -Fq "${marker}" <<<"${existing}"; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/78/comments" \
              -f body="${marker} This is a read-only retroactive discovery record for the frozen Phase 11 evidence campaign; it does not modify the evidence branch or benchmark." >/dev/null
          fi
          echo "Located run ${run_id}: status=${run_status} attempt=${run_attempt} conclusion=${run_conclusion:-pending}."
