name: Reconcile backend yarn.lock canonical form

on:
  push:
    branches:
      - maintenance/backend-yarn-lock-canonicalize

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/backend-yarn-lock-canonicalize
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: pod-provider/backend/yarn.lock
      - name: Match backend CI Git URL normalization
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          cd pod-provider/backend
          sed -i 's#ssh://git@github.com/#https://github.com/#g' yarn.lock
          sed -i 's#git+ssh://git@github.com/#git+https://github.com/#g' yarn.lock
          sed -i 's#git@github.com:#https://github.com/#g' yarn.lock
      - name: Generate exact canonical lockfile
        working-directory: pod-provider/backend
        run: yarn install
      - name: Commit canonical lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pod-provider/backend/yarn.lock
          if git diff --cached --quiet; then
            echo "No lockfile change"
            exit 0
          fi
          git commit -m "chore: canonicalize backend yarn.lock"
          git push origin HEAD:maintenance/backend-yarn-lock-canonicalize
